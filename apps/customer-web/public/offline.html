<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#16A34A" />
    <title>Offline · Apni Kirana</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', sans-serif;
        background: #FFFDF7;
        color: #111827;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #DCFCE7;
        color: #16A34A;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 32px;
        font-weight: 800;
      }
      h1 { font-size: 20px; margin: 8px 0; }
      p { color: #6B7280; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 16px;
        background: #16A34A;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">!</div>
      <h1>You're offline</h1>
      <p>
        Apni Kirana needs an internet connection to show fresh prices and
        place orders. Check your connection and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
