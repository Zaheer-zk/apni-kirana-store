# Production — build images and run. Use with: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      # Backend Dockerfile imports from ../shared, so we MUST build from
      # the monorepo root (not ./backend). Dockerfile path is relative to
      # the build context.
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    env_file:
      - .env.prod
    environment:
      # Persisted invoice/receipts directory inside the container. The
      # backend writes generated GST invoice PDFs here; we mount a named
      # volume so they survive container rebuilds.
      STORAGE_ROOT: /var/lib/aks/storage
    volumes:
      - backend_storage:/var/lib/aks/storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin:
    build:
      # Admin shares workspace deps with the rest of the monorepo, so build
      # context must be the repo root.
      context: .
      dockerfile: ./apps/admin/Dockerfile
      target: production
      # NEXT_PUBLIC_* must be a BUILD arg — Next.js inlines it into the client
      # bundle at build time. As a runtime `environment` var it has no effect.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  # Customer storefront — quickeasymart.com
  # Mirrors the admin service exactly; shares workspace deps (@aks/shared,
  # @aks/ui) so the build context must be the monorepo root.
  customer-web:
    build:
      context: .
      dockerfile: ./apps/customer-web/Dockerfile
      target: production
      args:
        # NEXT_PUBLIC_* must be a BUILD arg — Next.js inlines it into the
        # client bundle at build time. Setting it as a runtime `environment`
        # has no effect for `NEXT_PUBLIC_*` names.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_CUSTOMER}
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  # Store operator dashboard — store.quickeasymart.com
  # Partner-only web surface for store owners: dashboard, orders, inventory,
  # store profile + open/closed toggle. Mirrors customer-web exactly; shares
  # workspace deps so the build context must be the monorepo root.
  store-web:
    build:
      context: .
      dockerfile: ./apps/store-web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_STORE}
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  # Driver web app — driver.quickeasymart.com
  # Partner-only web surface for drivers: profile, deliveries, earnings,
  # online toggle. No background GPS (web can't run it reliably) — that
  # stays in the Expo app. Mirrors customer-web exactly.
  driver-web:
    build:
      context: .
      dockerfile: ./apps/driver-web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_DRIVER}
    env_file:
      - .env.prod
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - admin
      - customer-web
      - store-web
      - driver-web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  redis_data:
  backend_storage:    # GST invoice PDFs (and any future receipts/exports)
