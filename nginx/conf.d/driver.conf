# =============================================================================
# Driver Web App — driver.quickeasymart.com
# Proxies to the Next.js driver-web container on port 3000.
# Static Next.js assets are cached aggressively at the edge.
# No rate limiting at the vhost level — the backend enforces auth-level rate
# limits where needed.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — redirect all traffic to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name driver.quickeasymart.com;

    # Let Certbot verify domain ownership during cert issuance / renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://driver.quickeasymart.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — driver web app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name driver.quickeasymart.com;

    # -------------------------------------------------------------------------
    # SSL / TLS
    # -------------------------------------------------------------------------
    # init-ssl.sh issues ONE combined certificate covering api + admin +
    # customer + store + driver domains; Let's Encrypt stores it under the
    # first (api) domain's live/ folder, so every vhost points at the api
    # domain's cert path.
    ssl_certificate     /etc/letsencrypt/live/api.quickeasymart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quickeasymart.com/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # -------------------------------------------------------------------------
    # Common proxy settings
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js uses these for hot-reload websockets in dev; harmless in prod
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # -------------------------------------------------------------------------
    # PWA service worker — must be served from the site origin with a
    # cache-busting policy so we don't ship a stale SW.
    # -------------------------------------------------------------------------
    location = /sw.js {
        proxy_pass http://driver-web:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://driver-web:3000;
        add_header Cache-Control "public, max-age=3600";
    }

    # -------------------------------------------------------------------------
    # Next.js static assets — cache forever (filenames are content-hashed)
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://driver-web:3000;

        # 1 year, immutable — Next content-hashes every static asset so a
        # change in JS/CSS automatically produces a new URL.
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Quieter logs for the chatter of static assets
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Static files in /public — fonts, icons, robots.txt
    # -------------------------------------------------------------------------
    location ~* \.(?:ico|png|jpg|jpeg|webp|svg|gif|css|js|woff2?)$ {
        proxy_pass http://driver-web:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Everything else — proxy to the Next.js app
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://driver-web:3000;

        # First-byte SSR can be slow on a cold cache; allow extra time before
        # nginx gives up.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # Certbot ACME challenge
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
