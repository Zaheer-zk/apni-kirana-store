user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Security headers (applied globally)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate limiting zones. These are a coarse DoS guard only — per-endpoint
    # app limits live in the backend (express-rate-limit). 30r/m was far too
    # tight: a single admin dashboard page load makes many more calls than
    # that, so legitimate traffic was getting 503s.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=10r/m;
    # Auth zone covers the password-login and password-reset endpoints. These
    # are brute-force surfaces (login-password, admin-login, forgot-password,
    # reset-password). Keep it tight: 10 req/min/IP with a tiny burst. The
    # legitimate flow needs at most 2–3 requests, so this never hurts a real
    # user but blunts a credential-stuffing run.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    include /etc/nginx/conf.d/*.conf;
}
